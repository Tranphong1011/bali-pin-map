services:
  - type: web
    name: bali-pin-map
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --chdir backend --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NODE_VERSION
        value: 22.18.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # PostgreSQL connection string from Neon (postgresql://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Password needed to pin / unpin / edit on the live site
      - key: APP_PASSWORD
        sync: false
